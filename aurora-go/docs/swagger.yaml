basePath: /api
definitions:
  github_com_aurora-go_aurora_internal_dto.AnalyzeRequest:
    properties:
      dateRange:
        example: 7d
        type: string
      metric:
        example: pv,uv,bounce_rate
        type: string
      type:
        example: traffic
        type: string
    required:
    - type
    type: object
  github_com_aurora-go_aurora_internal_dto.EmailVO:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  github_com_aurora-go_aurora_internal_dto.QQLoginVO:
    properties:
      accessToken:
        description: QQ OAuth access_token
        type: string
      openId:
        description: QQ用户唯一标识
        type: string
    required:
    - accessToken
    - openId
    type: object
  github_com_aurora-go_aurora_internal_dto.ResetPasswordVO:
    properties:
      code:
        type: string
      email:
        type: string
      newPassword:
        maxLength: 100
        minLength: 6
        type: string
    required:
    - code
    - email
    - newPassword
    type: object
  github_com_aurora-go_aurora_internal_dto.SearchRequest:
    properties:
      pageNum:
        example: 1
        type: integer
      pageSize:
        example: 10
        type: integer
      query:
        example: Go语言如何实现高并发
        type: string
      topK:
        description: RAG检索数量
        example: 5
        type: integer
      useRag:
        description: 是否启用RAG增强
        example: true
        type: boolean
    required:
    - query
    type: object
  github_com_aurora-go_aurora_internal_dto.WriteRequest:
    properties:
      action:
        example: generate
        type: string
      articleId:
        type: integer
      content:
        example: 现有文章内容...
        type: string
      length:
        example: medium
        type: string
      style:
        example: professional
        type: string
      topic:
        example: Go语言并发编程实战
        type: string
    required:
    - action
    type: object
  github_com_aurora-go_aurora_internal_vo.ArticleTopFeaturedVO:
    properties:
      id:
        type: integer
      isFeatured:
        description: 指针类型，对标Java Integer
        enum:
        - 0
        - 1
        type: integer
      isTop:
        description: 指针类型，对标Java Integer
        enum:
        - 0
        - 1
        type: integer
    required:
    - id
    - isFeatured
    - isTop
    type: object
  github_com_aurora-go_aurora_internal_vo.ArticleVO:
    properties:
      articleAbstract:
        description: 文章摘要
        type: string
      articleContent:
        type: string
      articleCover:
        description: 文章封面
        type: string
      articleTitle:
        maxLength: 200
        type: string
      categoryName:
        description: 分类名称（对齐Java）
        type: string
      id:
        description: 编辑时传
        type: integer
      isFeatured:
        enum:
        - 0
        - 1
        type: integer
      isTop:
        enum:
        - 0
        - 1
        type: integer
      originalUrl:
        maxLength: 500
        type: string
      password:
        description: 密码保护文章
        maxLength: 64
        type: string
      status:
        enum:
        - 0
        - 1
        - 2
        - 3
        type: integer
      tagNames:
        description: 标签名称列表（对齐Java）
        items:
          type: string
        type: array
      type:
        enum:
        - 1
        - 2
        - 3
        type: integer
    required:
    - articleContent
    - articleTitle
    type: object
  github_com_aurora-go_aurora_internal_vo.CategoryVO:
    properties:
      categoryName:
        maxLength: 50
        type: string
    required:
    - categoryName
    type: object
  github_com_aurora-go_aurora_internal_vo.CommentVO:
    properties:
      aboutId:
        description: 关于页ID（type=3时使用）
        type: integer
      articleId:
        description: 文章ID（type=1时使用）
        type: integer
      commentContent:
        description: 评论内容（兼容前端 commentContent 字段名）
        type: string
      current:
        description: 当前页（对标Java MyBatis-Plus分页）
        type: integer
      friendLinkId:
        description: 友链ID（type=4时使用）
        type: integer
      parentId:
        description: 回复的父评论ID(0=顶级)
        type: integer
      replyUserId:
        description: 被回复用户ID
        type: integer
      size:
        description: 每页大小
        type: integer
      talkId:
        description: 说说ID（type=5时使用）
        type: integer
      topicId:
        description: 主题ID（前端传字符串，对标Java topicId）
        type: string
      type:
        enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        type: integer
    required:
    - type
    type: object
  github_com_aurora-go_aurora_internal_vo.FriendLinkVO:
    properties:
      id:
        description: 更新时必填，创建时为空
        type: integer
      linkAddress:
        description: 对标Java：@NotBlank
        maxLength: 50
        type: string
      linkAvatar:
        description: 对标Java：@NotBlank
        maxLength: 255
        type: string
      linkIntro:
        description: 对标Java：@NotBlank
        maxLength: 100
        type: string
      linkName:
        description: 对标Java：@NotBlank
        maxLength: 20
        type: string
    required:
    - linkAddress
    - linkAvatar
    - linkIntro
    - linkName
    type: object
  github_com_aurora-go_aurora_internal_vo.JobVO:
    properties:
      concurrent:
        description: 对标Java：Integer类型
        type: integer
      cronExpression:
        description: 对标Java：无验证标签
        type: string
      invokeTarget:
        description: 对标Java：无验证标签
        type: string
      jobGroup:
        description: 对标Java：无验证标签（前端可能不传）
        type: string
      jobName:
        description: 对标Java：无验证标签
        type: string
      misfirePolicy:
        description: 对标Java：Integer类型
        type: integer
      remark:
        description: 对标Java：无验证标签
        type: string
      status:
        description: 对标Java：Integer类型
        type: integer
    type: object
  github_com_aurora-go_aurora_internal_vo.LoginVO:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  github_com_aurora-go_aurora_internal_vo.MenuVO:
    properties:
      component:
        maxLength: 50
        type: string
      icon:
        maxLength: 50
        type: string
      isHidden:
        description: 是否隐藏 0否1是（数据库对应 is_hidden 字段）
        type: integer
      name:
        maxLength: 20
        type: string
      orderNum:
        description: 排序号（数据库对应 order_num 字段）
        type: integer
      parentId:
        type: integer
      path:
        maxLength: 50
        type: string
    required:
    - component
    - icon
    - name
    - orderNum
    - path
    type: object
  github_com_aurora-go_aurora_internal_vo.PasswordVO:
    properties:
      newPassword:
        maxLength: 100
        minLength: 6
        type: string
      oldPassword:
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  github_com_aurora-go_aurora_internal_vo.PhotoAlbumVO:
    properties:
      albumCover:
        maxLength: 1024
        type: string
      albumDesc:
        description: Java用albumDesc，Go前端传albumDesc
        maxLength: 50
        type: string
      albumName:
        maxLength: 20
        type: string
      id:
        description: 更新时必填，创建时为空
        type: integer
      status:
        description: 1公开 2私密
        enum:
        - 1
        - 2
        type: integer
    required:
    - albumName
    type: object
  github_com_aurora-go_aurora_internal_vo.RegisterVO:
    properties:
      code:
        description: 邮箱验证码
        maxLength: 6
        type: string
      email:
        description: 可选，为空时用username代替
        maxLength: 50
        type: string
      nickname:
        description: 可选，为空时自动从邮箱生成
        maxLength: 30
        type: string
      password:
        maxLength: 100
        minLength: 6
        type: string
      username:
        description: 前端用username传邮箱
        maxLength: 50
        type: string
    required:
    - code
    - password
    - username
    type: object
  github_com_aurora-go_aurora_internal_vo.ResourceVO:
    properties:
      id:
        description: 更新时必填，创建时为空
        type: integer
      isAnonymous:
        description: 是否匿名 0否1是
        type: integer
      parentId:
        description: 父模块ID，模块为null
        type: integer
      requestMethod:
        enum:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        type: string
      resourceName:
        maxLength: 50
        type: string
      url:
        description: 模块不需要URL
        maxLength: 255
        type: string
    required:
    - resourceName
    type: object
  github_com_aurora-go_aurora_internal_vo.RoleVO:
    properties:
      menuIds:
        items:
          type: integer
        type: array
      roleName:
        maxLength: 20
        type: string
    required:
    - roleName
    type: object
  github_com_aurora-go_aurora_internal_vo.TagVO:
    properties:
      tagName:
        maxLength: 50
        type: string
    required:
    - tagName
    type: object
  github_com_aurora-go_aurora_internal_vo.TalkVO:
    properties:
      content:
        description: 说说内容不能为空
        type: string
      id:
        type: integer
      images:
        description: 说说图片JSON数组字符串
        type: string
      isTop:
        description: 置顶状态(0否 1是)，去掉required避免0值校验失败
        type: integer
      status:
        description: 说说状态(1公开 2私密)，去掉required避免0值校验失败
        type: integer
    required:
    - content
    type: object
  github_com_aurora-go_aurora_internal_vo.WebsiteConfigVO:
    properties:
      alipayQRCode:
        description: 对标Java：支付宝二维码
        type: string
      author:
        description: 对标Java：网站作者
        type: string
      authorAvatar:
        description: 对标Java：网站头像
        type: string
      authorIntro:
        description: 对标Java：网站作者介绍
        type: string
      beianNumber:
        description: 对标Java：工信部备案号
        type: string
      csdn:
        description: 对标Java：csdn
        type: string
      englishName:
        description: 对标Java：网站英文名称
        type: string
      favicon:
        description: 对标Java：favicon
        type: string
      gitee:
        description: 对标Java：gitee
        type: string
      github:
        description: 对标Java：github
        type: string
      gonganBeianNumber:
        description: 对标Java：公安部备案编号
        type: string
      isCommentReview:
        description: 对标Java：Integer（0关闭1开启）
        type: integer
      isEmailNotice:
        description: 对标Java：Integer（0关闭1开启）
        type: integer
      isReward:
        description: 对标Java：Integer（0关闭1开启）
        type: integer
      juejin:
        description: 对标Java：juejin
        type: string
      logo:
        description: 对标Java：网站logo
        type: string
      multiLanguage:
        description: 对标Java：Integer（0关闭1开启）
        type: integer
      name:
        description: 对标Java：网站名称
        type: string
      notice:
        description: 对标Java：网站公告
        type: string
      qq:
        description: 对标Java：qq
        type: string
      qqLogin:
        description: 对标Java：Integer（0关闭1开启）
        type: integer
      stackoverflow:
        description: 对标Java：stackoverflow
        type: string
      touristAvatar:
        description: 对标Java：游客头像
        type: string
      twitter:
        description: 对标Java：twitter
        type: string
      userAvatar:
        description: 对标Java：用户头像
        type: string
      weChat:
        description: 对标Java：微信
        type: string
      websiteCreateTime:
        description: 对标Java：网站创建时间
        type: string
      websiteTitle:
        description: 对标Java：网页标题
        type: string
      weiXinQRCode:
        description: 对标Java：微信二维码
        type: string
      weibo:
        description: 对标Java：微博
        type: string
      zhihu:
        description: 对标Java：zhihu
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: aurora@example.com
    name: Aurora Team
  description: Aurora 博客系统 Go 1.26 后端 - 基于 tRPC-Agent-Go 的 AI 驱动博客平台
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://github.com/nicepkg/aurora
  title: Aurora Blog API
  version: "1.0"
paths:
  /api/:
    get:
      consumes:
      - application/json
      description: 获取前台首页聚合数据（文章/分类/标签/友链/统计）
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回首页数据
          schema:
            type: object
        "500":
          description: 服务器内部错误
          schema:
            type: object
      summary: 获取前台首页数据
      tags:
      - 网站信息
  /api/about:
    get:
      consumes:
      - application/json
      description: 获取前台公开的关于页面内容
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回关于页面内容
          schema:
            type: object
        "500":
          description: 服务器内部错误
          schema:
            type: object
      summary: 获取关于页面内容
      tags:
      - 关于
  /api/admin/:
    get:
      consumes:
      - application/json
      description: 获取后台管理首页统计数据
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回后台统计数据
          schema:
            type: object
        "401":
          description: 未授权/Token无效
          schema:
            type: object
        "500":
          description: 服务器内部错误
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 获取后台首页统计数据
      tags:
      - 网站信息
  /api/admin/about:
    post:
      consumes:
      - application/json
      description: 保存或更新关于页面内容（后台管理）
      parameters:
      - description: 关于页面内容
        in: body
        name: content
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            type: object
        "400":
          description: 请求参数错误
          schema:
            type: object
        "401":
          description: 未授权/Token无效
          schema:
            type: object
        "500":
          description: 服务器内部错误
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 保存/更新关于页面
      tags:
      - 关于
  /api/admin/articles:
    get:
      consumes:
      - application/json
      description: 获取后台文章列表（分页，含状态筛选）
      parameters:
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      - description: 当前页码
        in: query
        name: current
        type: integer
      - description: 每页数量
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回文章列表
          schema:
            type: object
        "401":
          description: 未授权/Token无效
          schema:
            type: object
        "500":
          description: 服务器内部错误
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 后台文章管理列表
      tags:
      - 文章
    post:
      consumes:
      - application/json
      description: 后台新增或更新文章，通过articleVO.id区分新增/更新
      parameters:
      - description: 文章信息
        in: body
        name: articleVO
        required: true
        schema:
          $ref: '#/definitions/github_com_aurora-go_aurora_internal_vo.ArticleVO'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            type: object
        "400":
          description: 请求参数错误
          schema:
            type: object
        "401":
          description: 未授权/Token无效
          schema:
            type: object
        "500":
          description: 服务器内部错误
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 新增/更新文章
      tags:
      - 文章
    put:
      consumes:
      - application/json
      description: 批量逻辑删除或恢复文章
      parameters:
      - description: 文章ID列表
        in: body
        name: ids
        required: true
        schema:
          items:
            type: integer
          type: array
      - description: 是否删除(0恢复/1删除)
        in: body
        name: isDelete
        required: true
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            type: object
        "400":
          description: 请求参数错误
          schema:
            type: object
        "401":
          description: 未授权/Token无效
          schema:
            type: object
        "500":
          description: 服务器内部错误
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 逻辑删除/恢复文章
      tags:
      - 文章
  /api/admin/articles/{id}:
    get:
      consumes:
      - application/json
      description: 后台根据ID获取文章详情（含编辑信息）
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回文章详情
          schema:
            type: object
        "400":
          description: 请求参数错误
          schema:
            type: object
        "401":
          description: 未授权/Token无效
          schema:
            type: object
        "500":
          description: 服务器内部错误
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 后台获取文章详情
      tags:
      - 文章
  /api/admin/articles/{id}/password:
    put:
      consumes:
      - application/json
      description: 为文章设置或取消密码访问
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      - description: 密码，为空则取消密码访问
        in: body
        name: password
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            type: object
        "400":
          description: 请求参数错误
          schema:
            type: object
        "401":
          description: 未授权/Token无效
          schema:
            type: object
        "500":
          description: 服务器内部错误
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 设置/取消文章密码访问
      tags:
      - 文章
  /api/admin/articles/{id}/status:
    put:
      consumes:
      - application/json
      description: 更新文章的置顶或推荐状态
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      - description: 状态信息
        in: body
        name: statusVO
        required: true
        schema:
          $ref: '#/definitions/github_com_aurora-go_aurora_internal_vo.ArticleTopFeaturedVO'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            type: object
        "400":
          description: 请求参数错误
          schema:
            type: object
        "401":
          description: 未授权/Token无效
          schema:
            type: object
        "500":
          description: 服务器内部错误
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 更新文章状态（置顶/推荐）
      tags:
      - 文章
  /api/admin/articles/delete:
    delete:
      consumes:
      - application/json
      description: 物理删除文章（回收站使用）
      parameters:
      - description: 文章ID列表
        in: body
        name: ids
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            type: object
        "400":
          description: 请求参数错误
          schema:
            type: object
        "401":
          description: 未授权/Token无效
          schema:
            type: object
        "500":
          description: 服务器内部错误
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 彻底删除文章
      tags:
      - 文章
  /api/admin/articles/export:
    post:
      consumes:
      - application/json
      description: 批量导出文章为Markdown文件
      parameters:
      - description: 文章ID列表
        in: body
        name: ids
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回导出URL列表
          schema:
            type: object
        "400":
          description: 请求参数错误
          schema:
            type: object
        "401":
          description: 未授权/Token无效
          schema:
            type: object
        "500":
          description: 服务器内部错误
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 批量导出文章
      tags:
      - 文章
  /api/admin/articles/images:
    post:
      consumes:
      - multipart/form-data
