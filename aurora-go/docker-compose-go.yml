version: "3.8"
services:
  mysql:
    # MySQL 8.4 LTS（8.0 全系 2026-04-30 EOL；8.4 支持至 ~2032）
    # 升级注意：8.4 默认禁用 mysql_native_password，go-sql-driver v1.10 已支持 caching_sha2_password
    image: mysql:8.4.10
    container_name: aurora-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: aurora
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - /opt/aurora/mysql/data:/var/lib/mysql
    networks:
      - aurora-network
    restart: always
    command: --innodb_buffer_pool_size=128M --innodb_log_buffer_size=8M --innodb_flush_log_at_trx_commit=2 --sync_binlog=100 --max_connections=50 --table_open_cache=200 --thread_cache_size=10 --performance_schema=OFF --skip-name-resolve --tmp_table_size=8M --max_heap_table_size=8M --innodb_flush_method=O_DSYNC

  redis:
    # 官方 Redis 固定 tag（弃用 redis-stack:latest 浮动 tag，不可复现构建）
    # 项目仅做缓存（save "" + allkeys-lru），无 RediSearch/JSON 等 stack 模块依赖
    # 8.2 线安全支持至 2030-09
    image: redis:8.2.9-alpine
    container_name: aurora-redis
    ports:
      - "6379:6379"
    volumes:
      - /opt/aurora/redis/data:/data
    networks:
      - aurora-network
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 32mb --maxmemory-policy allkeys-lru --save ""

  rabbitmq:
    # RabbitMQ 4.3 线（3.11 早已 EOL；4.2 社区支持止于 2026-07-31，4.3 为当前支持线）
    # 3.x → 4.x：经典队列 mirroring 已移除（单机无影响）；客户端 amqp091-go 同步升级 v1.15.0
    image: rabbitmq:4.3.6-management
    container_name: aurora-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - /opt/aurora/rabbitmq/data:/var/lib/rabbitmq
    networks:
      - aurora-network
    restart: always

  elasticsearch:
    # 8.19.21：补齐 CVE-2026-72649（ML 反序列化 RCE, CVSS 8.8，项目已禁 ML 降险）
    # 8.19 线支持至 2027-07-15；后续升 9.x 需以 8.19.x 为跳板（官方要求）
    image: elasticsearch:8.19.21
    container_name: aurora-elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms96m -Xmx160m"
      TZ: Asia/Shanghai
      # 安全关闭（博客无需认证）
      xpack.security.enabled: "false"
      # 禁用 GeoIP 下载（博客不需要，节省 ~30MiB）
      ingest.geoip.downloader.enabled: "false"
      # 禁用 deprecation 日志写入索引
      logger.deprecation.level: "ERROR"
      # 关闭 memory_lock（减少强制内存锁定，允许 swap 释放）
      bootstrap.memory_lock: "false"
      # Lucene 内存优化
      indices.memory.index_buffer_size: "5%"
      indices.fielddata.cache.size: "5%"
      indices.breaker.total.limit: "50%"
      indices.breaker.fielddata.limit: "30%"
      indices.breaker.request.limit: "30%"
      # 查询优化
      indices.query.bool.max_clause_count: "512"
      http.max_content_length: "50mb"
      # 关闭机器学习（省内存）
      xpack.ml.enabled: "false"
      # 关闭 watcher（告警功能，博客不需要）
      xpack.watcher.enabled: "false"
      # ILM 优化：减少历史索引
      indices.lifecycle.history_index_enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - /opt/aurora/elasticsearch/data:/usr/share/elasticsearch/data
      - /opt/aurora/elasticsearch/plugins:/usr/share/elasticsearch/plugins
    networks:
      - aurora-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 640M
        reservations:
          memory: 384M

  # ============================================
  # 对象存储：RustFS 1.0.0 GA（Apache-2.0，S3 API 兼容）
  # 替代 bitnami/minio（AGPL + 2025-08 断供 + CVE-2025-62506）
  # 差异要点：
  #   - 凭据 env: RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY（非 MINIO_ROOT_*）
  #   - 数据卷: /data（bitnami 是 /bitnami/minio/data，磁盘格式不互通，需 S3 API 层迁移）
  #   - 容器以非 root UID 10001 运行，宿主机目录需 chown -R 10001:10001
  #   - 无 MINIO_DEFAULT_BUCKETS 等私有特性，aurora bucket 需初始化一次
  #   - minio-go SDK 可直连（S3 API 兼容），Go 代码零改动
  # ============================================
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: aurora-rustfs
    environment:
      RUSTFS_ACCESS_KEY: "${MINIO_ROOT_USER}"
      RUSTFS_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /opt/aurora/rustfs/data:/data
    networks:
      - aurora-network
    restart: always

  nginx:
    # 1.28.0 stable（2026-04-23 发布）
    image: nginx:1.28.0-alpine
    container_name: aurora-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/aurora/nginx/conf:/etc/nginx
      - /opt/aurora/nginx/html:/usr/share/nginx/html
      - /opt/aurora/vue/blog:/usr/share/nginx/blog
      - /opt/aurora/vue/admin:/usr/share/nginx/admin
      - /opt/aurora/nginx/cert:/etc/nginx/cert
    networks:
      - aurora-network
    restart: always

  # ============================================
  # Aurora Go 后端 (替代 springboot 服务)
  # Go 编译为静态二进制，无需JRE/JDK运行时
  # 镜像仅 ~5MB (alpine) vs Java ~80MB (JRE)
  # ============================================
  aurora-go:
    image: alpine:3.22
    container_name: aurora-go
    environment:
      TZ: Asia/Shanghai
      # Docker网络内部服务名覆盖配置
      AURORA_MYSQL_HOST: aurora-mysql
      AURORA_MYSQL_PORT: "3306"
      AURORA_MYSQL_USER: root
      AURORA_MYSQL_PASSWORD: ${AURORA_MYSQL_PASSWORD}
      AURORA_MYSQL_DBNAME: aurora
      AURORA_REDIS_HOST: aurora-redis
      AURORA_REDIS_PORT: "6379"
      AURORA_REDIS_PASSWORD: ${AURORA_REDIS_PASSWORD}
      AURORA_RABBITMQ_HOST: aurora-rabbitmq
      AURORA_RABBITMQ_PORT: "5672"
      AURORA_RABBITMQ_USER: ${RABBITMQ_USER}
      AURORA_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AURORA_ELASTICSEARCH_USERNAME: "${AURORA_ELASTICSEARCH_USERNAME}"
      AURORA_ELASTICSEARCH_PASSWORD: "${AURORA_ELASTICSEARCH_PASSWORD}"
      AURORA_MINIO_ACCESS_KEY: "${AURORA_MINIO_ACCESS_KEY}"
      AURORA_MINIO_SECRET_KEY: "${AURORA_MINIO_SECRET_KEY}"
      AURORA_MINIO_BUCKET: aurora
      AURORA_JWT_SECRET: "${AURORA_JWT_SECRET}"
      AURORA_JWT_EXPIRE_TIME: "168"
      AURORA_SERVER_MODE: release
      AURORA_SEARCH_MODE: elasticsearch
      AURORA_UPLOAD_MODE: minio
    ports:
      - "8080:8080"
    volumes:
      # 上传编译好的二进制文件 + 配置文件
      - /opt/aurora/app/aurora-server:/app/aurora-server
      - /opt/aurora/app/configs:/app/configs
      - /opt/aurora/app/uploads:/app/uploads
      - /opt/aurora/app/scripts:/app/scripts
      # 时区文件: 确保 TZ=Asia/Shanghai 生效 (alpine 默认不含 tzdata)
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - aurora-network
    restart: always
    working_dir: /app
    # Go程序已内置 time.FixedZone("CST", 8*3600) 降级方案，无需 apk add tzdata
    # 挂载宿主机时区文件确保 TZ=Asia/Shanghai 对系统命令生效
    command: ["/app/aurora-server", "--config", "configs/config.yaml"]

  maxwell:
    # 注意：zendesk/maxwell 项目维护基本停滞，最新 1.41.x 对 MySQL 8.4 binlog
    # 格式兼容性需验证。若升级 MySQL 8.4 后 maxwell 异常，备选方案：
    # 1. 用 debezium 替代；2. 改用 MySQL 触发器 + Go 消费者
    image: zendesk/maxwell:latest
    container_name: aurora-maxwell
    volumes:
      - /opt/aurora/maxwell/config/config.properties:/app/config.properties
    networks:
      - aurora-network
    restart: always
    command: >
      bin/maxwell --host=aurora-mysql --user=root --password=${MAXWELL_MYSQL_PASSWORD}
        --producer=rabbitmq --rabbitmq_host=aurora-rabbitmq
        --rabbitmq_user=${RABBITMQ_USER} --rabbitmq_pass=${RABBITMQ_PASSWORD}
        --rabbitmq_exchange=maxwell --rabbitmq_exchange_type=topic
        --rabbitmq_routing_key_template=%{database}.%{table}
        --client_id=maxwell_prod

networks:
  aurora-network:
    external: true
