# Aurora Go 博客系统配置文件
# 基于 Java application-prod.yml 迁移
#
# 环境变量覆盖规则 (viper AutomaticEnv):
#   AURORA_ 前缀 + 下划线分隔层级
#   例: mysql.password → AURORA_MYSQL_PASSWORD
#   例: redis.host     → AURORA_REDIS_HOST
#   环境变量值会覆盖此文件中的同名字段
#
# 敏感信息请通过环境变量注入，不要直接写在此文件中！
# host/endpoint 默认指向本机（开发环境），生产环境通过 AURORA_*_HOST 等环境变量覆盖

server:
  port: 8080
  mode: release
  site_url: https://www.aqi125.cn
  enable_scheduler: true  # 是否启用定时任务调度器

mysql:
  host: 127.0.0.1               # 生产环境通过 AURORA_MYSQL_HOST 覆盖
  port: 3306
  user: root
  password: ""                    # 由 .env (AURORA_MYSQL_PASSWORD) 覆盖
  dbname: aurora
  max_open_conns: 20
  max_idle_conns: 5
  max_lifetime: 1800

redis:
  host: 127.0.0.1               # 生产环境通过 AURORA_REDIS_HOST 覆盖
  port: 6379
  password: ""                    # 由 .env (AURORA_REDIS_PASSWORD) 覆盖
  db: 1
  pool_size: 100

rabbitmq:
  host: 127.0.0.1               # 生产环境通过 AURORA_RABBITMQ_HOST 覆盖
  port: 5672
  user: guest                     # 通过 AURORA_RABBITMQ_USER 覆盖
  password: ""                    # 由 .env (AURORA_RABBITMQ_PASSWORD) 覆盖
  vhost: /
  prefetch_count: 10

elasticsearch:
  urls:
    - "http://127.0.0.1:9200"    # 生产环境通过 AURORA_ELASTICSEARCH_URLS 覆盖
  index_name: article
  username: ""                    # 由 .env (AURORA_ELASTICSEARCH_USERNAME) 覆盖
  password: ""                    # 由 .env (AURORA_ELASTICSEARCH_PASSWORD) 覆盖
  sniff_enabled: false

minio:
  endpoint: "http://127.0.0.1:9000"  # 生产环境通过 AURORA_MINIO_ENDPOINT 覆盖
  url: "https://ws.aqi125.cn"          # 外部访问URL (对标Java minio.url, 用于前端加载图片)
  access_key: ""                  # 由 .env (AURORA_MINIO_ACCESS_KEY) 覆盖
  secret_key: ""                  # 由 .env (AURORA_MINIO_SECRET_KEY) 覆盖
  bucket: aurora
  use_ssl: false

# 搜索模式: mysql / elasticsearch
search:
  mode: elasticsearch

# 上传模式: minio / oss
upload:
  mode: minio

jwt:
  secret: ""                      # 由 .env (AURORA_JWT_SECRET) 覆盖
  expire_time: 168
  issuer: aurora-go

qq:
  app_id: "102007196"
  check_token_url: "https://graph.qq.com/oauth2.0/me?access_token={access_token}"
  user_info_url: "https://graph.qq.com/user/get_user_info?openid={openid}&access_token={access_token}&oauth_consumer_key={oauth_consumer_key}"

ip2region:
  enabled: true
  db_file: "ip2region.xdb"   # 相对路径（相对于项目根目录），会自动拼接 scripts/ip/ 前缀

log:
  level: info
  format: json
  output_path: ""

email:
  enabled: true          # 启用邮件服务（发送验证码、评论通知、订阅通知）
  host: smtp.qq.com
  port: 465
  username: ""                    # 由 .env (AURORA_EMAIL_USERNAME) 覆盖
  password: ""                    # 由 .env (AURORA_EMAIL_PASSWORD) 覆盖
  from_name: Aurora Blog
  is_ssl: true
  verify_code_expire: 5

baidu_seo:
  enabled: false
  token: ""

agent:
  enabled: false
  llm:
    default_provider: deepseek
    providers:
      openai:
        api_key: ""       # 通过 OPENAI_API_KEY 注入
        base_url: https://api.openai.com/v1
        model: gpt-4o-mini
        temperature: 0.7
        max_tokens: 2000
      deepseek:
        api_key: ""       # 通过 DEEPSEEK_API_KEY 注入
        base_url: https://api.deepseek.com/v1
        model: deepseek-chat
        temperature: 0.7
        max_tokens: 2000
      qwen:
        api_key: ""       # 通过 QWEN_API_KEY 注入
        base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model: qwen-plus
        temperature: 0.7
        max_tokens: 2000
      claude:
        api_key: ""       # 通过 CLAUDE_API_KEY 注入
        base_url: https://api.anthropic.com/v1
        model: claude-sonnet-4-20250514
        temperature: 0.7
        max_tokens: 2000
  memory:
    type: redis
    max_turns: 20

# ==================== GitHub 作品集同步 (可选) ====================
# 用于首页作品集自动同步 GitHub 仓库，需配合定时任务 auroraQuartz.syncGitHubRepos
# 初始化脚本见 scripts/portfolio.sql
github:
  enabled: false              # 是否启用作品集同步
  username: ""                # GitHub 用户名（如 zhouyqxy）
  token: ""                   # Personal Access Token，建议通过 AURORA_GITHUB_TOKEN 注入（无 token 限额 60/h，有 token 5000/h）
  exclude: ""                 # 排除的仓库名，逗号分隔（如 test,demo,xxx.github.io）
