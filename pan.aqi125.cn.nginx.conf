# pan.aqi125.cn HTTPS 配置
# 将以下内容添加到 /opt/aurora/nginx/conf/nginx.conf 的 http 块中

    # HTTP 重定向到 HTTPS
    server {
        listen       80;
        server_name  pan.aqi125.cn;
        return 301 https://$server_name$request_uri;
    }

    # pan.aqi125.cn HTTPS 配置
    server {
        listen  443 ssl;
        server_name  pan.aqi125.cn;

        # SSL 证书配置（请根据实际上传的证书文件名调整）
        ssl_certificate /etc/nginx/cert/pan.aqi125.cn_bundle.pem;
        ssl_certificate_key /etc/nginx/cert/pan.aqi125.cn.key;

        # SSL 优化参数
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 前端静态文件服务
        location / {
            root   /usr/share/nginx/aipan;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 如果需要代理 API 请求到后端，取消注释以下配置
